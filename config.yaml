# Datalake runtime configuration.
# Overridden by environment variables; overridden again by CLI flags.
# See docs/05-inference-client.md and docs/08-ops-and-demo.md for field semantics.
#
# Deployment-specific values (wafer_base_url, wafer_loop_model, judge_model,
# openai_baseline_model) live in .env and are loaded via pydantic-settings.
# Keep this file for tuning knobs only.

wafer_concurrency: 8    # Tuned empirically: 16 hit Wafer 429s, 8 fits the rate-limit envelope.
openai_concurrency: 8
judge_concurrency: 4    # Judge bursts during eval; keep below Wafer global cap.
per_doc_concurrency: 4  # In-doc fan-out (propose × N etc.) — bounded so 1 doc doesn't starve global cap.

n_proposers: 3   # full ensemble — propose × 3 → critique × 3 → refine × 3 → vote → enrich
per_doc_budget_seconds: 180   # Wafer is slower than the design assumed — was 30s
trace_sample_k: 10

wafer_spend_ceiling_usd: 30

paths:
  sqlite_db: ./.datalake/datalake.db
  logs_dir: ./.datalake/logs
  heuristics: ./datalake/prompts/heuristics.yaml
  judge_rubric: ./datalake/eval/judge_rubric.yaml
