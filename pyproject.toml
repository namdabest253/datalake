[project]
name = "lakeaudit"
version = "0.1.0"
description = "Agentic data-preparation system for universities — Wafer Best Inference hackathon MVP."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "loguru>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "streamlit>=1.35",
    "streamlit-autorefresh>=1.0",
    "tiktoken>=0.7",
    "typer>=0.12",
]

[project.optional-dependencies]
eval = ["openai>=1.30"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
lakeaudit = "lakeaudit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lakeaudit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
